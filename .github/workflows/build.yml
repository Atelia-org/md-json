name: Build and publish NuGet package

on:
  pull_request:
    branches: [main]
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MdJson.slnx

      - name: Test
        run: dotnet test MdJson.slnx -c Release --no-restore

      - name: Pack
        shell: bash
        run: |
          args=()
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            args+=("-p:Version=${GITHUB_REF_NAME#v}")
          fi
          dotnet pack src/MdJson/MdJson.csproj -c Release --no-restore -o artifacts "${args[@]}"

      - uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: artifacts/*.nupkg
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: nuget-package
          path: artifacts

      - name: NuGet login (OIDC)
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push package to nuget.org
        run: dotnet nuget push artifacts/*.nupkg --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json
